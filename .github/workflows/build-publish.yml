name: Build and publish new Fyr OCI image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "Dockerfile"
      - "app.meta.json"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fyr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          echo "value=$(jq -r .version app.meta.json)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(jq -r .frontend_version app.meta.json)" >> "$GITHUB_OUTPUT"
          echo "backend=$(jq -r .backend_version app.meta.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            fyr.frontend-version=${{ steps.version.outputs.frontend }}
            fyr.backend-version=${{ steps.version.outputs.backend }}
