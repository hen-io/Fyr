[supervisord]
nodaemon=true
user=root

[program:gunicorn]
# One process (login lockout and MQTT state live in memory) but many threads:
# status checks and widget polls run in parallel instead of queueing.
command=gunicorn -b 127.0.0.1:8584 --workers 1 --threads 16 --timeout 30 wsgi:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
