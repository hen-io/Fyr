[supervisord]
nodaemon=true
user=root

# Each service writes to a size-rotated file under /var/log/fyr (read by the
# admin panel's Logs tab); the two tail programs at the bottom copy the same
# lines to the container's stdout so `docker logs` keeps working.

[program:gunicorn]
# One process (login lockout and MQTT state live in memory) but many threads:
# status checks and widget polls run in parallel instead of queueing.
command=gunicorn -b 127.0.0.1:8584 --workers 1 --threads 16 --timeout 30 wsgi:app
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fyr/backend.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/fyr/nginx.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1

[program:logtail-backend]
command=tail -n 0 -F /var/log/fyr/backend.log
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:logtail-nginx]
command=tail -n 0 -F /var/log/fyr/nginx.log
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
