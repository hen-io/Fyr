      // Apply the theme before the app bundle loads, from what this browser
      // last saw (own choice > server default), so there is no flash of the

      try {

        var srv = JSON.parse(localStorage.getItem("fyr-server-defaults") || "{}") || {};
        var root = document.documentElement;
        var pick = function (k) { return own[k] !== undefined ? own[k] : srv[k]; };
        if (pick("palette")) root.setAttribute("data-palette", pick("palette"));
        if (pick("theme")) root.setAttribute("data-theme", pick("theme"));
        if (pick("fontStyle")) root.setAttribute("data-font", pick("fontStyle"));
        var rd = pick("roundness");
        if (typeof rd === "number") {
          root.style.setProperty("--radius", rd + "px");
          root.style.setProperty("--radius-tile", Math.min(50, Math.round(rd * 9) / 10) + "%");
          root.style.setProperty("--radius-sm", Math.max(2, Math.round(rd / 2)) + "px");
        }
        if (srv.siteTitle) document.title = srv.siteTitle;
        if (pick("language")) root.setAttribute("lang", pick("language"));
        var mode = pick("colorMode") || "dark";
        if (mode === "auto") mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.setAttribute("data-mode", mode);
        if (pick("bgEffect")) root.setAttribute("data-bg-effect", pick("bgEffect"));
        if (srv.tileOpacity !== undefined) root.style.setProperty("--tile-alpha", String(srv.tileOpacity / 100));
        if (srv.gridMargin !== undefined) root.style.setProperty("--grid-margin", srv.gridMargin + "px");
        if (srv.contentWidth !== undefined) root.style.setProperty("--content-max", srv.contentWidth + "px");
        if (srv.windowOpacity !== undefined) root.style.setProperty("--window-alpha", String(srv.windowOpacity / 100));
        if (srv.tileBlur !== undefined) root.style.setProperty("--tile-blur", srv.tileBlur + "px");
        if (srv.splashMode === "off") root.classList.add("no-splash");
      } catch (e) {}

    <style>
      /* The splash screen. Inline, so it is on screen with the very first paint -
         before the app's own script and data have arrived. The app fades it out
         (hooks/useSplash.js); the script below is the safety net. */
      #fyr-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg, #0c0806);

        font-family: var(--font-ui, system-ui, sans-serif);
        transition: opacity 0.6s ease, visibility 0s linear 0.6s;

      :root.no-splash #fyr-splash { display: none; }
      #fyr-splash.fs-out { opacity: 0; visibility: hidden; pointer-events: none; }
      #fyr-splash.fs-out .fs-card { transform: scale(1.07); filter: blur(8px); }

      /* two slow pools of the palette's colours behind the glass */
      .fs-pool {
        position: absolute;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;

      /* curved glare across the top of the card */
      .fs-card::before {
        content: "";

        inset: 0;
        border-radius: inherit;
        background: radial-gradient(130% 70% at 50% -18%, rgb(255 255 255 / 0.3), transparent 62%);
        pointer-events: none;
      }

      /* the orb: a glass sphere with a ring of light running round it */
      .fs-orb {
        position: relative;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background:

        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 45%, color-mix(in srgb, var(--accent, #ffb347) 45%, transparent) 72%, var(--accent, #ffb347) 96%, #fff 100%);
        -webkit-mask: radial-gradient(circle, transparent 66%, #000 67.5%, #000 71%, transparent 72.5%);
        mask: radial-gradient(circle, transparent 66%, #000 67.5%, #000 71%, transparent 72.5%);

      @keyframes fsFloat { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-4px); } }

  <body>
    <div id="fyr-splash" role="status" aria-live="polite">
      <div class="fs-pool a"></div>
      <div class="fs-pool b"></div>
      <div class="fs-pool c"></div>
      <div class="fs-card">
        <div class="fs-orb"><img src="/rocket-logo.svg" alt="" /></div>
        <div class="fs-title" id="fyr-splash-title">Fyr</div>
        <div class="fs-bar"><span></span></div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("fyr-splash");
        try {
          var cached = JSON.parse(localStorage.getItem("fyr-server-defaults") || "{}") || {};
          if (cached.siteTitle) document.getElementById("fyr-splash-title").textContent = cached.siteTitle;
        } catch (e) {}
        // The app calls this when it is ready (or after the configured time).
        window.__fyrSplashHide = function () {
          if (!splash || splash.classList.contains("fs-out")) return;
          splash.classList.add("fs-out");
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
        };
        // Never trap anyone behind the splash if the app fails to start.
        setTimeout(window.__fyrSplashHide, 12000);
      })();
    </script>
