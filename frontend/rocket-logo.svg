<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="rl-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f0ff"/>
      <stop offset="55%" stop-color="#cdc6f0"/>
      <stop offset="100%" stop-color="#9c8fd9"/>
    </linearGradient>
  </defs>

  <g stroke="#241b3d" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">

    <!-- rocket, tilted slightly for a launch-in-motion feel -->
    <g transform="rotate(8 32 40)">

      <!-- flame -->
      <path d="M32 40
               C 28.5 45, 27 50, 28.5 56
               C 30 53, 31 50, 32 48
               C 33 50, 34 53, 35.5 56
               C 37 50, 35.5 45, 32 40 Z"
            fill="#ff5a2e"/>
      <path d="M32 44
               C 30.3 47.5, 29.7 51, 30.6 54.5
               C 31.3 52.5, 31.7 50.5, 32 49
               C 32.3 50.5, 32.7 52.5, 33.4 54.5
               C 34.3 51, 33.7 47.5, 32 44 Z"
            fill="#ffd23f" stroke="none"/>

      <!-- fins -->
      <path d="M24 32 L14 44 L24 41 Z" fill="#ff2ec4"/>
      <path d="M40 32 L50 44 L40 41 Z" fill="#8b5cf6"/>

      <!-- engine collar -->
      <rect x="27" y="38" width="10" height="5" rx="1.5" fill="#a8a0c8"/>

      <!-- body -->
      <path d="M32 4
               C 40 10, 42.5 20, 41.5 33
               C 41.2 36.5, 39.6 39, 37.5 40.5
               L 26.5 40.5
               C 24.4 39, 22.8 36.5, 22.5 33
               C 21.5 20, 24 10, 32 4 Z"
            fill="url(#rl-body)"/>

      <!-- nose cone -->
      <path d="M32 4 C 36 8, 38.5 13, 39.5 18.5 C 36.3 16.6, 33.8 15.8, 32 15.8
                C 30.2 15.8, 27.7 16.6, 24.5 18.5 C 25.5 13, 28 8, 32 4 Z"
            fill="#ff2ec4"/>

      <!-- window -->
      <circle cx="32" cy="26" r="6" fill="#241b3d"/>
      <circle cx="32" cy="26" r="4.2" fill="#8fd9ff"/>
      <circle cx="30.3" cy="24.3" r="1.3" fill="#ffffff" stroke="none"/>
    </g>
  </g>
</svg>
