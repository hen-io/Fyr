      try {

        if (typeof rd === "number") {

          root.style.setProperty("--radius-tile", Math.min(50, Math.round(rd * 9) / 10) + "%");
          root.style.setProperty("--radius-sm", Math.max(2, Math.round(rd / 2)) + "px");

        if (mode === "auto") mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";

        if (srv.gridMargin !== undefined) root.style.setProperty("--grid-margin", srv.gridMargin + "px");
        if (srv.contentWidth !== undefined) root.style.setProperty("--content-max", srv.contentWidth + "px");
        if (srv.windowOpacity !== undefined) root.style.setProperty("--window-alpha", String(srv.windowOpacity / 100));

    <style>
      /* The welcome screen: the logo, the site's name and a line of light.
         Inline, so it is on screen with the very first paint - before the app's
         own script and data have arrived. The app fades it out
         (hooks/useSplash.js); the script below is the safety net. */
      #fyr-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg, #0c0806);

  <body>
    <div id="fyr-splash" role="status" aria-live="polite">
      <div class="fs-card">
        <img class="fs-logo" src="/logo.png" alt="" />
        <div class="fs-title" id="fyr-splash-title">Fyr</div>
        <div class="fs-bar"><span></span></div>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("fyr-splash");
        try {
          var cached = JSON.parse(localStorage.getItem("fyr-server-defaults") || "{}") || {};
          if (cached.siteTitle) document.getElementById("fyr-splash-title").textContent = cached.siteTitle;
        } catch (e) {}
        // The app calls this when it is ready (or after the configured time).
        window.__fyrSplashHide = function () {
          if (!splash || splash.classList.contains("fs-out")) return;
          splash.classList.add("fs-out");
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
        };
        // Never trap anyone behind the splash if the app fails to start.
        setTimeout(window.__fyrSplashHide, 12000);
      })();
    </script>
