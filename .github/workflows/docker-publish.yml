name: Build and publish Fyr image

on:
  push:
    branches: [main]
    paths:
      - "Source/backend/**"
      - "Source/launcher/**"
      - "docker/**"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fyr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Source/launcher/package.json's "version" is the one place this
      # number is defined - the About page reads it via appInfo.js, and
      # this tags the image with the same value, so both always agree.
      - name: Read app version
        id: version
        run: echo "value=$(jq -r .version Source/launcher/package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.value }}
