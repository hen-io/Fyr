<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fyr · App Offline</title>

  <!-- Load your real launcher styles -->
  <link rel="stylesheet" href="/styles/globals.css" />
  <link rel="stylesheet" href="/styles/theme.css" />

  <style>
    /* Force RED error theme */
    :root {
      --accent: #ff3b5f;
      --blob1: #ff003c;
      --blob2: #ff6a00;
      --blob3: #ff8fa3;
    }

    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      gap: 20px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    p {
      opacity: 0.85;
      margin: 0;
      font-size: 1.1rem;
    }

    /* Countdown */
    .countdown {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .dial {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 10px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.05); }
    }

    .num {
      font-size: 36px;
      font-weight: 800;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255,255,255,0.2);
    }

    footer {
      text-align: center;
      padding: 10px;
      opacity: 0.6;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <!-- Your real blob background -->
  <div class="blob-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Your real launcher header -->
  <header class="glass" style="margin-bottom: 0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="
        width:36px; height:36px; border-radius:10px;
        background:var(--accent);
        display:flex; align-items:center; justify-content:center;
        font-size:20px; font-weight:700; color:white;
      ">🚀</div>
      <h2 style="margin:0;">Fyr</h2>
    </div>
  </header>

  <main>
    <h1>Tjenesten er offline</h1>
    <p>Vi prøver igjen automatisk om et øyeblikk.</p>

    <div class="countdown">
      <div class="dial" id="dial">
        <div class="num" id="num">10</div>
      </div>

      <button class="btn" id="retry">Oppdater nå</button>
    </div>
  </main>

  <footer>
    © <span id="year"></span> Fyr · App Offline
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    let t = 10;
    const num = document.getElementById("num");
    const dial = document.getElementById("dial");

    function tick() {
      num.textContent = t;

      const interval = setInterval(() => {
        t--;
        num.textContent = t;

        const p = Math.max(0, Math.min(1, (10 - t) / 10));
        dial.style.borderColor = `rgba(255, 90, 90, ${0.25 + p * 0.55})`;

        if (t <= 0) {
          clearInterval(interval);
          location.reload();
        }
      }, 1000);
    }

    tick();

    document.getElementById("retry").onclick = () => location.reload();
  </script>
</body>
</html>
