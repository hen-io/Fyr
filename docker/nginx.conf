# Login attempts per client address: a short burst is fine (typos), a stream is
# not. The backend has its own per-account limits (app/ratelimit.py); this one
# stops a flood before it costs any password hashing at all.
limit_req_zone $binary_remote_addr zone=fyr_login:1m rate=20r/m;

server {
    listen 80;
    server_name _;

    # Polling makes the access log pure noise; errors go to stderr, which supervisord
    # writes to /var/log/fyr/nginx.log (the admin panel's Logs tab).
    access_log off;
    error_log stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (icons, profile pictures) are at most a couple of MB; the backend
    # enforces its own, smaller, per-upload limits.
    client_max_body_size 4m;

    # Clickjacking / MIME-sniffing / referrer hardening. Only this site may
    # frame Fyr itself (the apps Fyr frames are unaffected by this). The rest
    # of the Content-Security-Policy (what the page may load and run) is a
    # <meta> tag in index.html, written at build time - see vite.config.js.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The backend is only reachable from inside this container (gunicorn
    # binds 127.0.0.1 only) - nginx is the single thing this container
    # exposes, matching how every other route through this same frontend
    # origin already worked (see vite.config.js's dev-server proxy, which
    # mirrors this exact pair of paths).
    location /api/ {
        proxy_pass http://127.0.0.1:8584;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /api/login {
        limit_req zone=fyr_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8584;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /icons/ {
        proxy_pass http://127.0.0.1:8584;
    }

    # Everything Vite puts in /assets/ has a content hash in its name, so it
    # can be kept by the browser for good; a new build simply uses new names.
    # (add_header in a location replaces the server-level ones, so they are
    # repeated here.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html names the current build's files: always ask for a fresh copy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The logo keeps its name from build to build (it has no content hash), so
    # the browser must check for a new one instead of trusting its copy.
    location = /logo.png {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite copies public/error/index.html to dist/error/index.html verbatim -
    # shown if gunicorn is down/restarting instead of a raw nginx error page.
    error_page 502 503 504 /error/index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
